name: lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # shellcheck comes with the runner image, but shfmt doesn't.
      - name: Install shfmt
        run: |
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.14.1
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - run: make lint
